# Proxy inverso de la API. El proceso de Node escucha en 127.0.0.1:3000 y no
# está expuesto: la única puerta a internet es esta.
#
# Aquí solo está el puerto 80, y es a propósito: el bloque de TLS lo añade
# `certbot --nginx` cuando obtiene el certificado, copiando este mismo servidor.
# Escribirlo a mano sería declarar un certificado que aún no existe, y entonces
# nginx no arranca... y sin nginx arrancado, certbot no puede obtenerlo.

upstream devweb_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Un WebSocket no es una petición normal: hay que dejar pasar el cambio de
# protocolo, y solo cuando el cliente lo pide.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.oscarblancorosales.com;

    # Lo que necesita certbot para renovar sin parar nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Una partida de RISK manda acciones pequeñas y frecuentes; nada aquí sube
    # de unos kilobytes salvo un snapshot.
    client_max_body_size 1m;

    access_log /var/log/nginx/devweb-api.access.log;
    error_log  /var/log/nginx/devweb-api.error.log;

    location / {
        proxy_pass http://devweb_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una sala abierta puede pasar horas en silencio sin estar muerta.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
