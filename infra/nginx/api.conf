# Proxy inverso de la API. El proceso de Node escucha en 127.0.0.1:3000 y no
# está expuesto: la única puerta a internet es esta.
#
# Certbot añade el bloque TLS y la redirección al ejecutarse; este fichero es lo
# que hay antes de que lo haga.

upstream devweb_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Un WebSocket no es una petición normal: hay que dejar pasar el cambio de
# protocolo, y solo cuando el cliente lo pide.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.oscarblancorosales.com;

    # Lo que necesita certbot para renovar sin parar nginx.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.oscarblancorosales.com;

    # certbot rellena estas rutas la primera vez que se ejecuta.
    ssl_certificate     /etc/letsencrypt/live/api.oscarblancorosales.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.oscarblancorosales.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Una partida de RISK manda acciones pequeñas y frecuentes; nada aquí sube
    # de unos kilobytes salvo un snapshot.
    client_max_body_size 1m;

    access_log /var/log/nginx/devweb-api.access.log;
    error_log  /var/log/nginx/devweb-api.error.log;

    location / {
        proxy_pass http://devweb_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una sala abierta puede pasar horas en silencio sin estar muerta.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
