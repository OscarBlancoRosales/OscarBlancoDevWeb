<app-terminal-layout title="base64">
  <div class="tool">
    <div class="tool-head">
      <div class="tool-cmd">base64</div>
      <div class="tool-sub">{{ i18n.t('decoder.subtitle') }}</div>
    </div>

    <div class="tool-flags">
      <div class="flag">
        <span class="flag-label">formato</span>
        <div class="seg">
          @for (m of modes; track m.value) {
            <button class="seg-btn" [class.active]="mode === m.value" (click)="setMode(m.value)">
              {{ m.label }}
            </button>
          }
        </div>
      </div>

      @if (mode !== 'jwt') {
        <div class="flag">
          <span class="flag-label">sentido</span>
          <div class="seg">
            <button class="seg-btn" [class.active]="direction === 'encode'" (click)="setDirection('encode')">
              {{ i18n.t('decoder.encode') }}
            </button>
            <button class="seg-btn" [class.active]="direction === 'decode'" (click)="setDirection('decode')">
              {{ i18n.t('decoder.decode') }}
            </button>
          </div>
        </div>
        <div class="flag flag--row">
          <button class="btn btn--sm" (click)="swap()" [disabled]="!outputText" [title]="i18n.t('decoder.swapHint')">
            ⇅ {{ i18n.t('decoder.swap') }}
          </button>
        </div>
      }
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <span>entrada · {{ inputText.length }}</span>
          <button class="pane-btn" (click)="copyInput()" [disabled]="!inputText">⧉</button>
        </div>
        <textarea
          class="textarea"
          [(ngModel)]="inputText"
          (ngModelChange)="process()"
          [placeholder]="i18n.t('decoder.inputPlaceholder')"
          spellcheck="false"></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <span>salida · {{ outputText.length }}</span>
          <button class="pane-btn" (click)="copyOutput()" [disabled]="!outputText">
            {{ copied ? '✓' : '⧉' }}
          </button>
        </div>
        @if (errorMessage) {
          <div class="pane-body pane-body--error">{{ errorMessage }}</div>
        } @else {
          <pre class="pane-body">{{ outputText }}</pre>
        }
      </div>
    </div>

    <div class="tool-actions">
      <button class="btn btn--danger" (click)="clear()" [disabled]="!inputText">
        {{ i18n.t('common.clear') }}
      </button>
    </div>
  </div>
</app-terminal-layout>
