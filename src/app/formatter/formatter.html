<app-terminal-layout title="format">
  <div class="tool">
    <div class="tool-head">
      <div class="tool-cmd">format</div>
      <div class="tool-sub">{{ i18n.t('formatter.subtitle') }}</div>
    </div>

    <div class="tool-flags">
      <div class="flag">
        <span class="flag-label">lenguaje</span>
        <div class="seg">
          @for (m of modes; track m.value) {
            <button class="seg-btn" [class.active]="mode === m.value" (click)="setMode(m.value)">
              {{ m.label }}
            </button>
          }
        </div>
      </div>

      <div class="flag">
        <label class="flag-label" for="fmt-indent">sangría</label>
        <select id="fmt-indent" class="select" [(ngModel)]="indentSize" (ngModelChange)="format()">
          <option [ngValue]="2">2 espacios</option>
          <option [ngValue]="4">4 espacios</option>
          <option [ngValue]="0">tabulador</option>
        </select>
      </div>
    </div>

    <div class="tool-actions">
      <button class="btn btn--primary" (click)="format()" [disabled]="!inputText.trim()">
        {{ i18n.t('formatter.format') }}
      </button>
      <button class="btn" (click)="minify()" [disabled]="!inputText.trim()">
        {{ i18n.t('formatter.minify') }}
      </button>
      <button class="btn" (click)="swap()" [disabled]="!outputText">⇅ {{ i18n.t('decoder.swap') }}</button>
      <button class="btn btn--danger" (click)="clear()" [disabled]="!inputText">
        {{ i18n.t('common.clear') }}
      </button>
    </div>

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <span>entrada · {{ inputText.length }}</span>
        </div>
        <textarea
          class="textarea"
          [(ngModel)]="inputText"
          (ngModelChange)="onInput()"
          [placeholder]="i18n.t('formatter.inputPlaceholder')"
          spellcheck="false"></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <span>{{ errorMessage ? 'error' : 'salida · ' + outputText.length }}</span>
          <button class="pane-btn" (click)="copyOutput()" [disabled]="!outputText">
            {{ copied ? '✓' : '⧉' }}
          </button>
        </div>
        @if (errorMessage) {
          <div class="pane-body pane-body--error">{{ errorMessage }}</div>
        } @else {
          <pre class="pane-body">{{ outputText }}</pre>
        }
      </div>
    </div>

    @if (savings) {
      <p class="note note--ok">{{ savings }}</p>
    }
  </div>
</app-terminal-layout>
