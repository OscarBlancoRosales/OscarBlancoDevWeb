name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'infra/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No se despliega lo que no pasa las pruebas, aunque el push venga de main.
      - name: Comprobaciones
        run: |
          npm run lint
          npm run typecheck
          npm run test -w @devweb/shared
          npm run test -w @devweb/server

      # La entrega lleva un manifiesto propio con solo las dependencias de
      # producción del servidor, y su lockfile generado aquí. Reutilizar el del
      # monorepo arrastraría a la VPS todo lo que necesita la web.
      - name: Empaquetar la entrega
        run: |
          npm run build -w @devweb/server
          mkdir -p release
          cp apps/server/dist/server.mjs release/server.mjs
          node tools/pack-server-manifest.mjs
          npm install --prefix release --package-lock-only --omit=dev --no-audit --no-fund
          tar -czf devweb-api.tar.gz -C release .

      # `ssh` y `scp` vienen en el runner. Usar acciones de terceros aquí
      # significaría darle a un repositorio ajeno la clave que abre el servidor,
      # y confiar en que ninguna versión futura suya haga algo raro con ella.
      - name: Preparar el acceso
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # La huella del servidor va como secreto, no se descubre al vuelo:
          # aceptar la que conteste sería confiar en quien conteste.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Subir y desplegar
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy -o IdentitiesOnly=yes \
              devweb-api.tar.gz "$USER@$HOST:/tmp/devweb-api.tar.gz"
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "$USER@$HOST" \
              'sudo /usr/local/bin/devweb-deploy /tmp/devweb-api.tar.gz && rm -f /tmp/devweb-api.tar.gz'

      # El despliegue ya espera al health por dentro y vuelve atrás si falla.
      # Esto lo comprueba desde fuera, que es desde donde lo ven los usuarios.
      - name: Comprobar que responde desde internet
        run: curl -fsS --retry 5 --retry-delay 3 https://api.oscarblancorosales.com/health

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/deploy
