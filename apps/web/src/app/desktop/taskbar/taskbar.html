<div class="bar">
  <button
    class="start"
    [class.open]="menuOpen"
    (click)="toggleMenu(); $event.stopPropagation()"
    [title]="i18n.t('desk.start')">
    <span class="start-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- El buscador, como el de cualquier barra de inicio -->
  <button
    class="search-open"
    (click)="openMenu(); $event.stopPropagation()"
    [attr.aria-label]="i18n.t('desk.search')"
    [title]="i18n.t('desk.search')">
    <span class="search-glyph" aria-hidden="true">⌕</span>
    <span class="search-text">{{ i18n.t('desk.search') }}</span>
  </button>

  <div class="sep"></div>

  <!-- Lo que hay abierto -->
  <div class="tasks">
    @for (w of windows; track w.id) {
      <button
        class="task"
        [class.active]="w.id === activeId && !w.minimized"
        [class.min]="w.minimized"
        (click)="toggled.emit(w.id)"
        [title]="w.title">
        <span class="task-icon">❯_</span>
        <span class="task-name">{{ w.title }}</span>
      </button>
    }
  </div>

  <!-- La bandeja -->
  <div class="tray">
    <div class="lang" role="group" [attr.aria-label]="i18n.t('desk.language')">
      <button class="lang-btn" [class.on]="i18n.lang === 'es'" (click)="setLang('es')" title="Español">ES</button>
      <button class="lang-btn" [class.on]="i18n.lang === 'en'" (click)="setLang('en')" title="English">EN</button>
    </div>
    <button class="tray-btn" (click)="nextTheme()" [title]="i18n.t('desk.nextTheme')">
      <span class="swatch"></span>
    </button>
    <div class="clock" [title]="today()">
      <span class="clock-time">{{ clock() }}</span>
      <span class="clock-date">{{ today() }}</span>
    </div>
  </div>
</div>

@if (menuOpen) {
  <div class="menu-backdrop" (click)="closeMenu()"></div>
  <div class="menu" (click)="$event.stopPropagation()">
    <div class="menu-search">
      <span class="search-glyph">⌕</span>
      <input
        #search
        class="menu-input"
        type="text"
        [value]="query"
        (input)="onSearchInput($event)"
        (keydown)="onSearchKey($event)"
        [placeholder]="i18n.t('desk.searchPlaceholder')"
        autocomplete="off"
        spellcheck="false" />
    </div>

    <div class="menu-list">
      @for (item of results; track item.id) {
        <button class="menu-item" (click)="open(item)">
          <span class="menu-glyph">{{ item.glyph }}</span>
          <span class="menu-label">{{ label(item) }}</span>
        </button>
      } @empty {
        <div class="menu-empty">{{ i18n.t('desk.noResults') }}</div>
      }
    </div>

    <div class="menu-foot">
      <span class="menu-user">Oscar Blanco Rosales</span>
      <span class="menu-sub">{{ i18n.t('desk.menuSub') }}</span>
    </div>
  </div>
}
