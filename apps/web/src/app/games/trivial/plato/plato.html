<section class="escenario">
  <!-- El plató de verdad, si el navegador puede con él. Si no puede, no pinta
       nada y se queda el decorado de CSS de debajo, que sigue estando. -->
  <app-escenario3d [cuadro]="cuadro" />

  <div class="focos" aria-hidden="true"></div>
  <div class="suelo" aria-hidden="true"></div>

  <header class="marquesina">
    <span class="donde">{{ rotulo }}</span>

    <!-- El reloj vive en la cabecera y no en medio del juego: ahí no le quita
         sitio a la pregunta ni se le monta encima al bocadillo, que es lo que
         pasaba en el móvil. -->
    <span class="reloj">
      <ng-content select="app-cronometro" />
    </span>

    <span class="mandos">
      <button
        type="button"
        class="silencio"
        [attr.aria-pressed]="!callado"
        [title]="callado ? 'Poner sonido' : 'Silenciar'"
        (click)="alterna.emit()"
      >
        {{ callado ? '&#9834;' : '&#9835;' }}
      </button>
      <button type="button" class="salir" title="Salir del concurso" (click)="sale.emit()">
        &#10005;
      </button>
    </span>
  </header>

  <div class="tablas">
    <ng-content />
  </div>
</section>
