<div class="bar" [class.my-turn]="myTurn">
  <!--
    La cuenta de la reserva y el «terminar» viven en el bloque de fase, arriba a
    la izquierda: la fase es el control que la cierra. Aquí ya sólo queda lo que
    todavía no tiene su sitio definitivo.
  -->
  <button
    class="bar-undo"
    type="button"
    *ngIf="myTurn && phase === 'reinforce' && placedCount > 0"
    (click)="undo.emit()"
  >
    ↶ Deshacer
  </button>

  <!-- Mirar no es jugar: los paneles están siempre, toque o no toque. -->
  <div class="bar-panels">
    <button
      class="bar-panel bar-panel-chat"
      type="button"
      [class.active]="openPanel === 'chat'"
      (click)="togglePanel.emit('chat')"
      aria-label="Chat"
    >
      💬
    </button>
    <button
      class="bar-panel bar-panel-historia"
      type="button"
      [class.active]="openPanel === 'historia'"
      (click)="togglePanel.emit('historia')"
      aria-label="Historia"
    >
      📜
    </button>
  </div>
</div>
