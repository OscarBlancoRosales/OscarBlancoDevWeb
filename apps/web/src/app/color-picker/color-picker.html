<app-terminal-layout title="color">
  <div class="tool">
    <div class="tool-head">
      <div class="tool-cmd">color</div>
      <div class="tool-sub">{{ i18n.t('color.subtitle') }}</div>
    </div>

    <!-- El color, a lo grande: es lo que se viene a mirar -->
    <div class="hero" [style.background]="hexInput">
      <div class="hero-inner" [style.color]="readableOn">
        <span class="hero-hex">{{ hexInput.toUpperCase() }}</span>
        <span class="hero-contrast">{{ contrastLabel }}</span>
      </div>
      <input type="color" class="hero-input" [value]="hexInput" (input)="onPickerChange($event)"
             [attr.aria-label]="i18n.t('color.title')" />
    </div>

    <div class="tool-actions">
      <button class="btn" (click)="randomColor()">{{ i18n.t('color.random') }}</button>
    </div>

    <div class="formats">
      <div class="fmt">
        <span class="fmt-name">HEX</span>
        <input class="input" type="text" [(ngModel)]="hexInput" (ngModelChange)="onHexChange()" maxlength="7" spellcheck="false" />
        <button class="fmt-copy" (click)="copyValue(hexInput)">⧉</button>
      </div>

      <div class="fmt">
        <span class="fmt-name">RGB</span>
        <div class="triple">
          <label class="tri"><span>R</span><input class="input input--xs" type="number" min="0" max="255" [(ngModel)]="r" (ngModelChange)="onRgbChange()" /></label>
          <label class="tri"><span>G</span><input class="input input--xs" type="number" min="0" max="255" [(ngModel)]="g" (ngModelChange)="onRgbChange()" /></label>
          <label class="tri"><span>B</span><input class="input input--xs" type="number" min="0" max="255" [(ngModel)]="b" (ngModelChange)="onRgbChange()" /></label>
        </div>
        <button class="fmt-copy" (click)="copyValue(rgbString)">⧉</button>
      </div>

      <div class="fmt">
        <span class="fmt-name">HSL</span>
        <div class="triple">
          <label class="tri"><span>H</span><input class="input input--xs" type="number" min="0" max="360" [(ngModel)]="h" (ngModelChange)="onHslChange()" /></label>
          <label class="tri"><span>S</span><input class="input input--xs" type="number" min="0" max="100" [(ngModel)]="s" (ngModelChange)="onHslChange()" /></label>
          <label class="tri"><span>L</span><input class="input input--xs" type="number" min="0" max="100" [(ngModel)]="l" (ngModelChange)="onHslChange()" /></label>
        </div>
        <button class="fmt-copy" (click)="copyValue(hslString)">⧉</button>
      </div>
    </div>

    <div class="strip-block">
      <div class="strip-head">{{ i18n.t('color.shades') }}</div>
      <div class="strip">
        @for (c of palette; track c) {
          <button class="swatch" [style.background]="c" (click)="copyValue(c)" [title]="c"></button>
        }
      </div>
    </div>

    <div class="strip-block">
      <div class="strip-head">{{ i18n.t('color.harmony') }}</div>
      <div class="strip strip--wide">
        @for (c of harmony; track c.hex) {
          <button class="swatch swatch--wide" [style.background]="c.hex" (click)="copyValue(c.hex)" [title]="c.hex">
            <span class="swatch-label">{{ c.name }}</span>
          </button>
        }
      </div>
    </div>
  </div>
</app-terminal-layout>
