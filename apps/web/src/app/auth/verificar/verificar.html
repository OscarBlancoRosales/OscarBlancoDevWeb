<app-panel-cuenta
  [titulo]="i18n.t('cuenta.verifyTitle')"
  [error]="estado() === 'fallo' ? error() : ''"
>
  @switch (estado()) {
    @case ('comprobando') {
      <p class="tool-subtitle">{{ i18n.t('cuenta.checking') }}</p>
    }
    @case ('activada') {
      <p class="aviso">{{ i18n.t('cuenta.activated') }}</p>
      <p class="pie"><a routerLink="/auth">{{ i18n.t('cuenta.goLogin') }}</a></p>
    }
    @case ('fallo') {
      <!--
        Un enlace caducado o ya usado es el caso normal, no una avería: el
        token se gasta al activarla, así que abrir el correo dos veces acaba
        aquí. Por eso el camino de salida es pedir otro, no reintentar.
      -->
      <p class="pie">
        {{ i18n.t('cuenta.expired') }}
        <a routerLink="/auth/registro">{{ i18n.t('cuenta.signupAgain') }}</a>
        {{ i18n.t('cuenta.andWeSendNew') }}
      </p>
    }
  }
</app-panel-cuenta>
