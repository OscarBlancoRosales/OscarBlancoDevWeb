<!-- Menú hamburguesa -->
@if (showMenu) {
<div class="menu-container">
  <button class="menu-button" (click)="toggleMenu(); $event.stopPropagation()">
    <span></span>
    <span></span>
    <span></span>
  </button>
  @if (menuOpen) {
<div class="dropdown-menu" (click)="$event.stopPropagation()">
    <a href="#" (click)="navigateToConsole($event)">💻 Consola</a>
    <a href="#" (click)="navigateToScrumPoker($event)">🃏 Sala Scrum Poker</a>
    <a href="#" (click)="navigateToDniGenerator($event)">🆔 Generador DNI</a>
    <a href="#" (click)="navigateToQrGenerator($event)">📱 QR Generator</a>
    <a href="#" (click)="navigateToDecoder($event)">🔐 Encoder / Decoder</a>
    <a href="#" (click)="navigateToFormatter($event)">📝 Code Formatter</a>
    @if (isAuthenticated) {
<a href="#" (click)="clearSession($event)" class="logout-link">🗑️ Limpiar Sesión</a>
}
  </div>
}
</div>
}
